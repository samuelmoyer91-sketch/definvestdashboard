<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Institute for Strategic Technologies{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #14181F; background: #fff; }
        a { color: #D6217E; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Layout */
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }

        /* Header / Nav */
        header {
            background: #0B2545;
            color: #fff;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 800;
            font-size: 18px;
        }
        .logo-area img { height: 40px; }
        .logo-text { line-height: 1.2; }
        .logo-text .mag { color: #D6217E; }

        nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }
        nav a {
            color: #c9d6e5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active {
            color: #D6217E;
        }

        .logout-btn {
            font-size: 13px;
            color: #8a98b0;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .logout-btn:hover { color: #D6217E; }

        /* Mobile nav toggle (hidden on desktop) */
        .nav-toggle { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Content area */
        main { padding: 40px 0; }

        /* Footer */
        footer {
            background: #F5F6F8;
            border-top: 1px solid #e2e6ea;
            padding: 40px 20px;
            text-align: center;
            font-size: 13px;
            color: #6b7580;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner { flex-direction: column; align-items: flex-start; gap: 20px; }
            nav { flex-wrap: wrap; gap: 16px; font-size: 13px; }
            nav a { font-size: 13px; }
            main { padding: 24px 0; }
        }

        @media (max-width: 600px) {
            .header-inner { padding: 16px; }
            .logo-area { font-size: 14px; gap: 8px; }
            .logo-area img { height: 32px; }
            nav { flex-direction: column; width: 100%; gap: 8px; align-items: flex-start; margin-top: 16px; }
            nav a { display: block; padding: 8px 0; }
            main { padding: 16px 0; }
        }

        /* Page header band (photo) */
        .pagehead { position: relative; margin: -40px -20px 36px -20px; height: 240px; overflow: hidden; }
        .pagehead img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pagehead::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,37,69,0.9) 0%, rgba(11,37,69,0.35) 60%, rgba(11,37,69,0.15) 100%); }
        .pagehead .ph-text { position: absolute; bottom: 28px; left: 32px; right: 32px; z-index: 2; }
        .pagehead .ph-text h1 { color: #fff; margin: 0; font-size: 40px; }
        .pagehead .ph-text p { color: #dbe4ef; margin: 8px 0 0; font-size: 16px; max-width: 640px; }

        /* Section label */
        .section-title { font-size: 13px; letter-spacing: 2px; color: #6b7580; text-transform: uppercase; font-weight: 700; margin: 44px 0 18px; }

        /* Sponsor strip */
        .sponsor-strip { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
        .sponsor-chip { border: 1px solid #d0d7e1; border-radius: 6px; padding: 12px 20px; font-weight: 700; color: #4a5568; font-size: 14px; background: #fff; }

        /* Photo gallery band */
        .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .gallery img { width: 100%; height: 190px; object-fit: cover; border-radius: 8px; display: block; }

        /* Featured publications */
        .feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .feat-card { background: #f9fafb; border-radius: 8px; padding: 20px; border-top: 3px solid #D6217E; }
        .feat-card .ft { font-size: 11px; color: #fff; background: #D6217E; padding: 3px 10px; border-radius: 12px; font-weight: 700; }
        .feat-card h3 { color: #0B2545; font-size: 16px; margin: 10px 0 6px; line-height: 1.3; }
        .feat-card .fm { font-size: 13px; color: #6b7580; }

        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
            .feat-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .pagehead { height: 180px; margin: -16px -20px 24px -20px; }
            .pagehead .ph-text { left: 20px; bottom: 20px; }
            .pagehead .ph-text h1 { font-size: 26px; }
        }

    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="{{ root }}/" class="logo-area" style="color: inherit;">
                <img src="{{ root }}/static/ist/logos/ist-logo.png" alt="IST">
            </a>
            <nav>
                <a href="{{ root }}/">Home</a>
                <a href="{{ root }}/publications">Publications</a>
                <a href="{{ root }}/people">People</a>
                <a href="{{ root }}/podcast">Podcast</a>
                <a href="{{ root }}/conference">Conference</a>
                <a href="{{ root }}/about">About</a>
                <a href="{{ root }}/logout" class="logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Institute for Strategic Technologies. All rights reserved.</p>
    </footer>
</body>
</html>
