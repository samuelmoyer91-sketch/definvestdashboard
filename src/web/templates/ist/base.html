<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Institute for Strategic Technologies{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #14181F; background: #fff; }
        a { color: #D6217E; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Layout */
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }

        /* Header / Nav */
        header {
            background: #0B2545;
            color: #fff;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 800;
            font-size: 18px;
        }
        .logo-area img { height: 40px; }
        .logo-text { line-height: 1.2; }
        .logo-text .mag { color: #D6217E; }

        nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }
        nav a {
            color: #c9d6e5;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active {
            color: #D6217E;
        }

        .logout-btn {
            font-size: 13px;
            color: #8a98b0;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }
        .logout-btn:hover { color: #D6217E; }

        /* Mobile nav toggle (hidden on desktop) */
        .nav-toggle { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Content area */
        main { padding: 40px 0; }

        /* Footer */
        footer {
            background: #F5F6F8;
            border-top: 1px solid #e2e6ea;
            padding: 40px 20px;
            text-align: center;
            font-size: 13px;
            color: #6b7580;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner { flex-direction: column; align-items: flex-start; gap: 20px; }
            nav { flex-wrap: wrap; gap: 16px; font-size: 13px; }
            nav a { font-size: 13px; }
            main { padding: 24px 0; }
        }

        @media (max-width: 600px) {
            .header-inner { padding: 16px; }
            .logo-area { font-size: 14px; gap: 8px; }
            .logo-area img { height: 32px; }
            nav { flex-direction: column; width: 100%; gap: 8px; align-items: flex-start; margin-top: 16px; }
            nav a { display: block; padding: 8px 0; }
            main { padding: 16px 0; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="{{ root }}/" class="logo-area" style="color: inherit;">
                <img src="{{ root }}/static/ist/logos/ist-logo.png" alt="IST">
            </a>
            <nav>
                <a href="{{ root }}/">Home</a>
                <a href="{{ root }}/publications">Publications</a>
                <a href="{{ root }}/people">People</a>
                <a href="{{ root }}/podcast">Podcast</a>
                <a href="{{ root }}/conference">Conference</a>
                <a href="{{ root }}/about">About</a>
                <a href="{{ root }}/logout" class="logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Institute for Strategic Technologies. All rights reserved.</p>
    </footer>
</body>
</html>
