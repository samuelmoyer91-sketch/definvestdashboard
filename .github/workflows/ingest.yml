name: Ingest Pipeline

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 11:00 UTC (6 AM ET)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch RSS feeds
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
        run: python src/ingest/rss_fetcher.py

      - name: Screen titles
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/scraper/run_title_screen.py

      - name: Scrape articles
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
        run: python src/scraper/article_scraper.py

      - name: Generate AI summaries
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/scraper/generate_ai_summaries.py --limit 300

      # Runs AFTER summarization so today's good scrapes still get summarized;
      # a degraded feed fails this run (triggering the issue below) without
      # blocking the data that DID come through. See article_scraper.py's
      # FEED_HEALTH_MIN_RATE for the threshold and the incident that prompted it.
      - name: Check feed health
        run: |
          if [ -s feed_health_alerts.log ]; then
            echo "::error::Feed(s) below the scrape-health threshold:"
            cat feed_health_alerts.log
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FEED_ALERTS=""
          if [ -s feed_health_alerts.log ]; then
            FEED_ALERTS="

          **Feed health alert:**
          \`\`\`
          $(cat feed_health_alerts.log)
          \`\`\`"
          fi
          gh issue create \
            --title "Ingest pipeline failed $(date -u '+%Y-%m-%d')" \
            --body "The daily ingest pipeline failed on $(date -u '+%Y-%m-%d at %H:%M UTC').${FEED_ALERTS}

          [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
