name: Publish Site

on:
  schedule:
    - cron: '0 1 * * *'  # Daily at 01:00 UTC (8 PM ET previous day)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Geocode new deals
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
        run: python scripts/geocode_locations.py

      - name: Generate site
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # One-shot run: connect straight to the primary rather than
          # downloading the whole database into a throwaway replica.
          TURSO_REMOTE_ONLY: '1'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python generate_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy github_site --project-name capitalfordefense --branch main

      # Runs AFTER deploy so the site still ships, but partial data-step
      # failures (e.g. a fetcher silently failing for months) mark the run
      # failed and trigger the issue notification below.
      - name: Fail on partial step failures
        run: |
          if [ -s step_failures.log ]; then
            echo "::error::generate_site.py reported failed steps:"
            cat step_failures.log
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Publish pipeline failed $(date -u '+%Y-%m-%d')" \
            --body "The daily publish pipeline failed on $(date -u '+%Y-%m-%d at %H:%M UTC').

          [View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
